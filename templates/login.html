<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
    <h1><i class="fa-solid fa-right-to-bracket"></i> ログイン</h1>
    <form id="login-form">
        <input type="email" id="email" placeholder="メールアドレス" required>
        <input type="password" id="password" placeholder="パスワード" required>
        <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> ログイン</button>
    </form>
    <p style="text-align:center; margin-top:15px;">
        アカウントを持っていませんか？ <a href="{{ url_for('register') }}">新規登録</a>
    </p>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>事前用意リスト</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
    <h1 style="display:flex; justify-content:space-between; align-items:center;">
        <span>
            <i class="fa-solid fa-pen-to-square"></i> 事前用意リスト
        </span>
        <a href="{{ url_for('home') }}" style="text-decoration:none; color:#2a7ae2; font-size:1.5rem;">
            <i class="fa-solid fa-house"></i>
        </a>
    </h1>

    <div class="top-bar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <a href="{{ url_for('index') }}">
            <i class="fa-solid fa-shopping-cart" style="color:#2a7ae2;"></i> 買い物リストへ
        </a>

        <a href="/admin">
            <button
                style="padding: 0.5rem 1rem; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer;">
                <i class="fa-solid fa-database"></i> 商品管理へ
            </button>
        </a>
    </div>

    <div class="preset-form">
        <input type="text" id="new-preset-name" placeholder="新しい商品名を入力" lang="ja" inputmode="text" />
        <input type="number" id="new-preset-quantity" min="1" value="1" style="width:70px;" />
        <button id="preset-add-btn"><i class="fa-solid fa-plus"></i> 追加</button>
        <button id="preset-reset-btn" style="margin-left:10px; background-color:#f88;">
            <i class="fa-solid fa-trash-can"></i> 全削除
        </button>
    </div>

    <ul id="preset-edit-list"></ul>

    <h2>楽天レシピランキングから材料を追加</h2>
    <div>
        <select id="category-select"></select>
        <button id="load-ranking-btn"><i class="fa-solid fa-list"></i> ランキング表示</button>
    </div>
    <div id="recipe-results"></div>
    <div style="margin-top:10px;">
        <button id="load-more-btn" style="display:none;"><i class="fa-solid fa-plus"></i> さらに表示</button>
    </div>

    <h2>以前の買い物履歴</h2>
    <div id="shopping-history-list"
        style="margin-bottom: 2rem; border: 1px solid #ddd; padding: 1rem; max-height: 300px; overflow-y: auto;">
        <!-- ここに履歴が表示されます -->
    </div>


    <script>
        const STORAGE_KEY = "myPresetItems";
        const APP_ID = "1044097768285505378";
        const DISPLAY_STEP = 10; // 一度に表示する件数
        let allRecipes = [];     // 全レシピ保持用
        let currentIndex = 0;    // 現在表示中の件数

        // ローカルストレージ操作
        function getPresetItems() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        }
        function savePresetItems(items) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }
        function renderPresetList() {
            const list = document.getElementById("preset-edit-list");
            list.innerHTML = "";
            getPresetItems().forEach(({ name, quantity }, index) => {
                const li = document.createElement("li");
                li.textContent = `${name}（${quantity}個） `;
                const delBtn = document.createElement("button");
                delBtn.innerHTML = `<i class="fa-solid fa-xmark"></i> 削除`;
                delBtn.onclick = () => {
                    const items = getPresetItems();
                    items.splice(index, 1);
                    savePresetItems(items);
                    renderPresetList();
                };
                li.appendChild(delBtn);
                list.appendChild(li);
            });
        }

        // プリセット追加ボタン
        document.getElementById("preset-add-btn").onclick = () => {
            const nameInput = document.getElementById("new-preset-name");
            const quantityInput = document.getElementById("new-preset-quantity");
            const name = nameInput.value.trim();
            const quantity = Number(quantityInput.value);
            if (!name) return alert("商品名を入力してください");
            if (!quantity || quantity < 1) return alert("個数は1以上を入力してください");
            const items = getPresetItems();
            if (items.some(item => item.name === name)) {
                return alert("同じ名前の商品が存在します");
            }
            items.push({ name, quantity });
            savePresetItems(items);
            renderPresetList();
            nameInput.value = "";
            quantityInput.value = 1;
        };

        // 全削除
        document.getElementById("preset-reset-btn").onclick = () => {
            if (!confirm("本当に全削除しますか？")) return;
            localStorage.removeItem(STORAGE_KEY);
            renderPresetList();
        };

        // カテゴリ一覧取得
        async function fetchCategories() {
            const url = `https://app.rakuten.co.jp/services/api/Recipe/CategoryList/20170426?format=json&categoryType=large&applicationId=${APP_ID}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("カテゴリ取得エラー");
            const data = await res.json();
            return data.result.large || [];
        }

        // カテゴリをセレクトに表示
        async function populateCategorySelect() {
            const select = document.getElementById("category-select");
            const categories = await fetchCategories();
            categories.forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat.categoryId;
                opt.textContent = cat.categoryName;
                select.appendChild(opt);
            });
        }

        // カテゴリランキング取得
        async function fetchCategoryRanking(categoryId) {
            const url = `https://app.rakuten.co.jp/services/api/Recipe/CategoryRanking/20170426?format=json&applicationId=${APP_ID}&categoryId=${encodeURIComponent(categoryId)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("ランキング取得エラー");
            const data = await res.json();
            return data.result || [];
        }

        // 一部のレシピを追加表示
        function appendRecipeResults() {
            const container = document.getElementById("recipe-results");
            const slice = allRecipes.slice(currentIndex, currentIndex + DISPLAY_STEP);

            slice.forEach(recipe => {
                const item = document.createElement("div");
                item.classList.add("recipe-item");
                item.innerHTML = `
                    <h3>${recipe.recipeTitle}</h3>
                    <img src="${recipe.foodImageUrl}" alt="${recipe.recipeTitle}" style="max-width:150px;"><br>
                    <small>材料: ${recipe.recipeMaterial.join(", ")}</small><br>
                    <button><i class="fa-solid fa-plus"></i> 材料を追加</button>
                `;
                // 材料追加ボタン
                item.querySelector("button").onclick = () => {
                    const presetItems = getPresetItems();
                    recipe.recipeMaterial.forEach(mat => {
                        if (!presetItems.some(p => p.name === mat)) {
                            presetItems.push({ name: mat, quantity: 1 });
                        }
                    });
                    savePresetItems(presetItems);
                    renderPresetList();
                    alert("材料を追加しました！");
                };
                container.appendChild(item);
            });

            currentIndex += slice.length;

            // 全部表示したらボタン非表示
            if (currentIndex >= allRecipes.length) {
                document.getElementById("load-more-btn").style.display = "none";
            } else {
                document.getElementById("load-more-btn").style.display = "inline-block";
            }
        }

        // ランキング初期表示
        function startDisplayRecipes(recipes) {
            allRecipes = recipes;
            currentIndex = 0;
            document.getElementById("recipe-results").innerHTML = "";
            appendRecipeResults();
        }

        // 初期処理
        document.addEventListener("DOMContentLoaded", async () => {
            renderPresetList();
            await populateCategorySelect();

            // ランキング読み込みボタン
            document.getElementById("load-ranking-btn").onclick = async () => {
                const categoryId = document.getElementById("category-select").value;
                const recipes = await fetchCategoryRanking(categoryId);
                if (!recipes.length) {
                    document.getElementById("recipe-results").innerHTML = "<p>ランキングが見つかりませんでした。</p>";
                    document.getElementById("load-more-btn").style.display = "none";
                    return;
                }
                startDisplayRecipes(recipes);
            };

            // さらに表示ボタン
            document.getElementById("load-more-btn").onclick = appendRecipeResults;
        });

        function loadShoppingHistory() {
            const stored = localStorage.getItem("shoppingHistory");
            if (!stored) return [];
            try {
                return JSON.parse(stored);
            } catch {
                return [];
            }
        }
        function saveShoppingHistory(history) {
            localStorage.setItem("shoppingHistory", JSON.stringify(history));
        }

        function renderShoppingHistory() {
            const container = document.getElementById("shopping-history-list");
            if (!container) return;

            container.innerHTML = "";

            const history = loadShoppingHistory();

            if (history.length === 0) {
                container.textContent = "履歴はまだありません。";
                return;
            }

            history.forEach((entry, index) => {
                const div = document.createElement("div");
                div.classList.add("history-entry");
                div.style.border = "1px solid #ccc";
                div.style.padding = "0.5rem";
                div.style.marginBottom = "0.5rem";

                const header = document.createElement("div");
                header.style.fontWeight = "700";
                header.textContent = `${entry.date} (${entry.items.length}件)`;
                div.appendChild(header);

                const btnRestore = document.createElement("button");
                btnRestore.textContent = "プリセットに復元";
                btnRestore.style.marginRight = "0.5rem";
                btnRestore.onclick = () => {
                    const presetItems = getPresetItems();

                    // 履歴のアイテムを順に追加（同名アイテムは数量を合算）
                    entry.items.forEach(({ name, quantity }) => {
                        const existing = presetItems.find(p => p.name === name);
                        if (existing) {
                            existing.quantity += quantity; // 数量を加算
                        } else {
                            presetItems.push({ name, quantity });
                        }
                    });

                    savePresetItems(presetItems);
                    renderPresetList();
                    alert("履歴の内容をプリセットリストに復元しました。");
                };

                div.appendChild(btnRestore);

                const btnDelete = document.createElement("button");
                btnDelete.textContent = "履歴から削除";
                btnDelete.onclick = () => {
                    if (!confirm("この履歴を削除しますか？")) return;
                    const history = loadShoppingHistory();
                    history.splice(index, 1);
                    saveShoppingHistory(history);
                    renderShoppingHistory();
                };
                div.appendChild(btnDelete);

                container.appendChild(div);
            });
        }

        // ページ読み込み時に履歴を表示
        document.addEventListener("DOMContentLoaded", () => {
            renderShoppingHistory();
        });

    </script>
</body>

</html>

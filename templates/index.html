<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuyList+</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/icon-180.png') }}" />
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}" />
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='icons/icon-512.png') }}" />

    <!-- Firebase App (必須) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDI5HJyD3mTi67ndWrpb-tbd8c0jKOhjYg",
            authDomain: "shopping-app-754a1.firebaseapp.com",
            projectId: "shopping-app-754a1",
            storageBucket: "shopping-app-754a1.appspot.com",
            messagingSenderId: "1089983907690",
            appId: "1:1089983907690:web:1c6be68478230362ddc713",
            measurementId: "G-Y07NJF1SE1"
        };

        // Firebase初期化
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

</head>

<body>
    <h1 style="display:flex; justify-content:space-between; align-items:center;">
        <span>
            <i class="fa-solid fa-shopping-cart" style="color:#2a7ae2;"></i> 買い物リスト
        </span>
        <a href="{{ url_for('home') }}" style="text-decoration:none; color:#2a7ae2; font-size:1.5rem;">
            <i class="fa-solid fa-house"></i>
        </a>
    </h1>





    <div class="top-bar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <p>
            <a href="{{ url_for('preset') }}">
                <i class="fa-solid fa-pen-to-square"></i> 事前用意リストへ
            </a>
        </p>

        <a href="/admin">
            <button
                style="padding: 0.5rem 1rem; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer;">
                <i class="fa-solid fa-database"></i> 商品管理へ
            </button>
        </a>
    </div>

    <!-- 予算切替 -->
    <div id="budget-toggle-container">
        <button id="budget-toggle-btn" aria-label="予算設定切替"
            style="font-size:2rem; display:flex; align-items:center; gap:0.3rem;">
            <i id="wallet-icon" class="fa-solid fa-wallet"></i>
            <i id="money-icon" class="fa-solid fa-money-bill-wave" style="display:none; color:#27ae60;"></i>
        </button>
    </div>

    <div id="budget-setting" style="display:none;">
        <label for="budget"><i class="fa-solid fa-coins" style="color:#f39c12;"></i> 予算設定（円）：</label>
        <input type="number" id="budget" placeholder="予算を入力" />
        <button onclick="setBudget()"><i class="fa-solid fa-check"></i> 設定</button>
        <p id="budget-message"></p>
    </div>

    <!-- 商品登録フォーム -->
    <section id="product-entry" class="section-box">
        <h2><i class="fa-solid fa-plus-circle" style="color:#27ae60;"></i> 商品登録</h2>
        <div id="form">
            <input type="text" id="name" placeholder="商品名" lang="ja" inputmode="text" />
            <input type="number" id="price" placeholder="価格" />
            <input type="number" id="quantity" placeholder="数量" value="1" min="1" />
            <button id="form-add-btn"><i class="fa-solid fa-cart-plus"></i> 追加</button>
        </div>
        <!-- バーコードスキャン -->
        <button id="scan-btn" style="margin-top:0.5em;"><i class="fa-solid fa-camera"></i> バーコードスキャン</button>
        <video id="scanner" style="width:100%; display:none; margin-top:0.5em;"></video>
    </section>

    <!-- admin.html モーダル -->
    <div id="admin-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <iframe id="admin-iframe" src="" style="width:90%; height:80%; border:none; border-radius:8px;"></iframe>
        <button id="admin-close"
            style="position:absolute; top:1rem; right:1rem; font-size:1.5rem; color:white; background:none; border:none; cursor:pointer;">&times;</button>
    </div>

    <!-- 事前用意リスト -->
    <section id="preset-section" class="section-box">
        <h2><i class="fa-solid fa-list-check" style="color:#2980b9;"></i> 事前用意リスト</h2>
        <div id="preset-list"></div>
    </section>

    <!-- 買い物リスト -->
    <section id="shopping-list-section" class="section-box">
        <div id="shopping-list-header" style="display:flex; justify-content:space-between; align-items:center;">
            <h2><i class="fa-solid fa-list" style="color:#34495e;"></i> 買い物リスト</h2>
            <div id="sort" style="font-weight:bold; font-size:0.9rem;">
                <i class="fa-solid fa-sort"></i> 並び替え：
                <select id="sortOrder" onchange="sortItems()">
                    <option value="added">追加順</option>
                    <option value="priceAsc">合計金額の昇順</option>
                    <option value="priceDesc">合計金額の降順</option>
                    <option value="unitPriceAsc">単価の昇順</option>
                    <option value="unitPriceDesc">単価の降順</option>
                </select>
            </div>
        </div>
        <ul id="list"></ul>
        <p>
            合計: <span id="total">0</span> 円
            <span id="remaining" style="margin-left:1rem;"></span>
        </p>
    </section>

    <button id="end-shopping-btn"
        style="background:red; color:white; width:100%; padding:0.8em 0; font-size:1.1rem; text-align:center; border:none; border-radius:6px; cursor:pointer;">
        買い物終了
    </button>

    <!-- ZXing バーコードライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        const codeReader = new ZXing.BrowserBarcodeReader();
        const scanBtn = document.getElementById('scan-btn');
        const video = document.getElementById('scanner');
        const adminModal = document.getElementById('admin-modal');
        const adminIframe = document.getElementById('admin-iframe');
        const adminClose = document.getElementById('admin-close');

        scanBtn.addEventListener('click', async () => {
            video.style.display = 'block';
            try {
                const result = await codeReader.decodeOnceFromVideoDevice(undefined, 'scanner');
                console.log('バーコード:', result.text);

                // Firestoreで検索
                const docRef = db.collection('products').doc(result.text);
                const docSnap = await docRef.get();

                if (docSnap.exists) {
                    const data = docSnap.data();
                    document.getElementById('name').value = data.name;
                    document.getElementById('price').value = data.price;
                    alert('商品を自動入力しました');
                } else {
                    // admin.html モーダルで登録
                    adminIframe.src = `/admin?barcode=${result.text}`;
                    adminModal.style.display = 'flex';
                }
            } catch (err) {
                console.error(err);
                alert('スキャンに失敗しました。手入力してください。');
            }
        });

        adminClose.addEventListener('click', () => {
            adminModal.style.display = 'none';
            adminIframe.src = '';
        });

        // admin.html からのpostMessageで商品登録完了通知
        window.addEventListener('message', (event) => {
            if (event.data.type === 'product-registered') {
                document.getElementById('name').value = event.data.name;
                adminModal.style.display = 'none';
                adminIframe.src = '';
                alert('新商品を登録し、商品名を自動入力しました: ' + event.data.name);
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
    import { BrowserMultiFormatReader, BarcodeFormat } from "https://cdn.jsdelivr.net/npm/@zxing/browser@latest/+esm";

    // --- Firebase 初期化 ---
    const firebaseConfig = {
      apiKey: "AIzaSyDI5HJyD3mTi67ndWrpb-tbd8c0jKOhjYg",
      authDomain: "shopping-app-754a1.firebaseapp.com",
      projectId: "shopping-app-754a1",
      storageBucket: "shopping-app-754a1.appspot.com",
      messagingSenderId: "1089983907690",
      appId: "1:1089983907690:web:1c6be68478230362ddc713",
      measurementId: "G-Y07NJF1SE1"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- DOM Elements ---
    const barcodeInput = document.getElementById('barcode');
    const nameInput = document.getElementById('name');
    const categoryInput = document.getElementById('category');
    const makerInput = document.getElementById('maker');
    const volumeInput = document.getElementById('volume');
    const addBtn = document.getElementById('add-btn');
    const listEl = document.getElementById('product-list');
    const startScanBtn = document.getElementById('start-scan');
    const categorySelect = document.getElementById("category");
    const makerDatalist = document.getElementById("makers");
    const cameraPreview = document.getElementById("camera-preview");

    // --- Helpers ---
    const resetForm = () => {
      barcodeInput.value = "";
      barcodeInput.disabled = false;
      nameInput.value = "";
      categoryInput.value = "";
      makerInput.value = "";
      volumeInput.value = "";
    };

    const createProductItem = (productId, data) => {
      const li = document.createElement('li');
      const info = document.createElement('div');
      info.textContent = `${productId}: ${data.name} [カテゴリ: ${data.category || '-'} | メーカー: ${data.maker || '-'} | 内容量: ${data.volume || '-'}]`;

      const btnGroup = document.createElement('div');
      const editBtn = document.createElement('button');
      editBtn.innerHTML = '<i class="fa-solid fa-pen"></i>';
      editBtn.addEventListener('click', () => {
        barcodeInput.value = productId;
        barcodeInput.disabled = true;
        nameInput.value = data.name || "";
        categoryInput.value = data.category || "";
        makerInput.value = data.maker || "";
        volumeInput.value = data.volume || "";
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
      deleteBtn.addEventListener('click', async () => {
        if (confirm(`本当に ${productId} を削除しますか？`)) {
          await deleteDoc(doc(db, "products", productId));
        }
      });

      btnGroup.append(editBtn, deleteBtn);
      li.append(info, btnGroup);
      return li;
    };

    const updateCategoryAndMaker = (products) => {
      const categories = new Set();
      const makers = new Set();
      products.forEach(docSnap => {
        const data = docSnap.data();
        if (data.category) categories.add(data.category);
        if (data.maker) makers.add(data.maker);
      });

      // カテゴリ更新
      categorySelect.innerHTML = '<option value="">-- 選択してください --</option>';
      categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });

      // メーカー更新
      makerDatalist.innerHTML = "";
      makers.forEach(maker => {
        const option = document.createElement("option");
        option.value = maker;
        makerDatalist.appendChild(option);
      });
    };

    // --- Firestore リアルタイム監視 ---
    const productsCol = collection(db, "products");
    onSnapshot(productsCol, (snapshot) => {
      listEl.innerHTML = "";
      snapshot.forEach(docSnap => {
        const li = createProductItem(docSnap.id, docSnap.data());
        listEl.appendChild(li);
      });
      updateCategoryAndMaker(snapshot.docs);
    });

    // --- Add/Update Product ---
    addBtn.addEventListener('click', async () => {
      const barcode = barcodeInput.value.trim();
      const name = nameInput.value.trim();
      const category = categoryInput.value.trim();
      const maker = makerInput.value.trim();
      const volume = volumeInput.value.trim();

      if (!barcode || !name) {
        alert("バーコードと商品名を入力してください");
        return;
      }

      await setDoc(doc(db, "products", barcode), { name, category, maker, volume });
      window.parent.postMessage({ type: 'product-registered', barcode, name }, '*');
      window.location.reload();
    });

    // --- Barcode Auto-Fill ---
    barcodeInput.addEventListener("change", async () => {
      const code = barcodeInput.value.trim();
      if (!code) return;

      const docSnap = await getDoc(doc(db, "products", code));
      if (docSnap.exists()) {
        const data = docSnap.data();
        nameInput.value = data.name || "";
        categoryInput.value = data.category || "";
        makerInput.value = data.maker || "";
        volumeInput.value = data.volume || "";
        barcodeInput.disabled = true;
      } else resetForm();
    });

    // --- Camera Scan (ZXing) ---
    const codeReader = new BrowserMultiFormatReader();
    let selectedDeviceId = null;

    startScanBtn.addEventListener("click", async () => {
      cameraPreview.innerHTML = "";
      const previewElem = document.createElement("video");
      previewElem.style.width = "100%";
      cameraPreview.appendChild(previewElem);

      const devices = await BrowserMultiFormatReader.listVideoInputDevices();
      if (devices.length === 0) {
        alert("カメラが見つかりません");
        return;
      }

      // 初回のみ背面カメラを選択
      if (!selectedDeviceId) {
        const backCam = devices.find(d => d.label.toLowerCase().includes("back")) || devices[0];
        selectedDeviceId = backCam.deviceId;
      }

      codeReader.decodeFromVideoDevice(selectedDeviceId, previewElem, (result, err) => {
        if (result) {
          barcodeInput.value = result.getText();
          barcodeInput.dispatchEvent(new Event("change"));
          if (navigator.vibrate) navigator.vibrate(200);

          // 自動登録せず、フォーム確認へ
          codeReader.stopContinuousDecode();
        }
      }, { formats: [BarcodeFormat.EAN_13] });

      // スキャン枠表示
      const overlay = document.createElement("div");
      overlay.style.position = "absolute";
      overlay.style.border = "2px solid red";
      overlay.style.left = "25%";
      overlay.style.top = "40%";
      overlay.style.width = "50%";
      overlay.style.height = "20%";
      overlay.style.pointerEvents = "none";
      cameraPreview.style.position = "relative";
      cameraPreview.appendChild(overlay);
    });

  </script>
</head>

<body>
  <h1><i class="fa-solid fa-database"></i> 商品管理</h1>
  <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
    <p style="margin: 0;"><a href="{{ url_for('index') }}"><i class="fa-solid fa-arrow-left"></i> 買い物リストへ</a></p>
    <p style="margin: 0;"><a href="{{ url_for('setup') }}"><i class="fa-solid fa-gear"></i> 事前用意リストへ</a></p>
  </div>

  <div id="form">
    <button id="start-scan"><i class="fa-solid fa-camera"></i> カメラで入力</button>
    <input type="text" id="barcode" placeholder="JANコード" />
    <input type="text" id="name" placeholder="商品名" />
    <select id="category"></select>
    <input list="makers" id="maker" placeholder="メーカー名" />
    <datalist id="makers"></datalist>
    <input type="text" id="volume" placeholder="内容量" />
    <button id="add-btn"><i class="fa-solid fa-plus"></i> 登録/更新</button>
  </div>

  <div id="camera-preview" style="margin-top: 20px;"></div>

  <h2>登録済み商品</h2>
  <ul id="product-list"></ul>
</body>

</html>
